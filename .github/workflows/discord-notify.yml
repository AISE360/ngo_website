name: Discord Notifications

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          color: "#5865F2"
          username: "Al-Huda Welfare Society"
          avatar_url: "https://github.com/AISE360/ngo_website/raw/main/public/favicon.png"
          args: |
            ${{ github.event_name == 'push' && format('**{0}** pushed to **{1}**\n{2}', github.actor, github.ref_name, github.event.head_commit.message) || '' }}
            ${{ github.event_name == 'release' && format('**{0}** released **{1}**\n{2}', github.actor, github.event.release.tag_name, github.event.release.body) || '' }}
            ${{ github.event_name == 'workflow_dispatch' && format('Manual deploy triggered by **{0}**', github.actor) || '' }}
          fields: |
            [{"name": "Repository", "value": "${{ github.repository }}", "inline": true}, {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true}, {"name": "Commit", "value": "${{ github.sha }}", "inline": true}]