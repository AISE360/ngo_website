        - generic [ref=f7e33]: About Us
        - heading "Al-Huda Welfare Society" [level=1] [ref=f7e34]
        - paragraph [ref=f7e35]: A grassroots non-profit born from the belief that communities can lift each other up.
      - generic [ref=f7e38]:
        - generic [ref=f7e39]:
          - heading "Our Mission" [level=3] [ref=f7e45]
          - paragraph [ref=f7e46]: To uplift underprivileged families through transparent, community-driven education, health, and welfare programmes.
        - generic [ref=f7e47]:
          - heading "Our Vision" [level=3] [ref=f7e52]
          - paragraph [ref=f7e53]: A society where every child has access to education, every family has healthcare, and no one faces life events alone.
        - generic [ref=f7e54]:
          - heading "Community" [level=3] [ref=f7e61]
          - paragraph [ref=f7e62]: 165 active members from the Hyderabad region who contribute monthly and volunteer their time and skills.
        - generic [ref=f7e63]:
          - heading "Since 2010" [level=3] [ref=f7e68]
          - paragraph [ref=f7e69]: Over a decade of consistent service, building trust with donors and beneficiaries across Telangana.
      - generic [ref=f7e72]:
        - generic [ref=f7e73]:
          - generic [ref=f7e74]: Our journey
          - heading "From 12 families to 165+ — a decade of service" [level=2] [ref=f7e75]
          - generic [ref=f7e76]:
            - paragraph [ref=f7e77]: Al-Huda Welfare Society was founded in 2010 by a group of 12 families in Hyderabad who noticed that community members were struggling with educational expenses, unexpected medical bills, and the financial burden of marriages.
            - paragraph [ref=f7e78]: What started as an informal monthly collection of ₹200 per family has grown into a structured welfare organisation supporting 165 member families and hundreds of beneficiaries across Telangana.
            - paragraph [ref=f7e79]:
              - text: We operate on a
              - strong [ref=f7e80]: zero-overhead model
              - text: — every rupee collected goes directly to a beneficiary. Administrative costs are covered by voluntary contributions from founding members.
        - img "Community gathering" [ref=f7e83]
